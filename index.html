<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Unity WebGL Player | PlantsVsZombiesRH</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { touch-action: none; overscroll-behavior: none; }
      body {
        background: #1a1a1a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
      }
      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 960px;
        padding: 20px;
        z-index: 10;
      }
      #game-container {
        display: none;
        width: 960px;
        height: 600px;
        position: relative;
      }
      #game-container.fullscreen {
        width: 100vw;
        width: -webkit-fill-available;
        height: 100vh;
        height: -webkit-fill-available;
        max-width: none;
        max-height: none;
        position: fixed;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        touch-action: none;
      }
      .logo {
        font-size: 32px;
        font-weight: bold;
        color: #4CAF50;
        letter-spacing: 2px;
      }
      .progress-bar-container {
        width: 100%;
        max-width: 600px;
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4CAF50, #8BC34A);
        border-radius: 4px;
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 14px;
        color: #aaa;
      }
      .error-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 40px;
        text-align: center;
        max-width: 600px;
        z-index: 20;
      }
      .error-screen.visible { display: flex; }
      .error-icon { font-size: 48px; }
      .error-title { font-size: 24px; color: #f44336; }
      .error-message { color: #ccc; font-size: 14px; line-height: 1.6; }
      .error-details { background: #222; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #888; max-height: 200px; overflow: auto; text-align: left; width: 100%; }
      .retry-btn {
        padding: 12px 32px;
        background: #4CAF50;
        border: none;
        border-radius: 4px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        -webkit-appearance: none;
        transition: background 0.2s;
      }
      .retry-btn:hover { background: #45a049; }
      .info-text { color: #666; font-size: 12px; margin-top: 10px; }
      @media (max-width: 960px) {
        #game-container { width: 100vw; width: -webkit-fill-available; height: 100vh; height: -webkit-fill-available; }
        #loading-screen { max-width: 100vw; padding: 10px; }
        .logo { font-size: 24px; }
      }
      @supports (-webkit-touch-callout: none) {
        body { min-height: -webkit-fill-available; }
        #game-container.fullscreen { height: -webkit-fill-available; width: -webkit-fill-available; }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="logo">Plants vs Zombies RH</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text">Initializing...</div>
      <div class="info-text" id="info-text">Loading game assets (~180MB)...</div>
    </div>

    <div id="error-screen" class="error-screen">
      <div class="error-icon">⚠</div>
      <div class="error-title" id="error-title">Failed to Load</div>
      <div class="error-message" id="error-message"></div>
      <div class="error-details" id="error-details"></div>
      <button class="retry-btn" onclick="retryLoad()">Retry</button>
    </div>

    <div id="game-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <script src="Build/build.loader.js"></script>
    <script>
      const loadingScreen = document.getElementById('loading-screen');
      const gameContainer = document.getElementById('game-container');
      const errorScreen = document.getElementById('error-screen');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const infoText = document.getElementById('info-text');
      const errorTitle = document.getElementById('error-title');
      const errorMessage = document.getElementById('error-message');
      const errorDetails = document.getElementById('error-details');
      const canvas = document.getElementById('unity-canvas');

      let unityInstance = null;
      let loadingStartTime = Date.now();
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      const isMobile = isIOS || /Android/i.test(navigator.userAgent);
      // Force WebGL 1 for all browsers - this build's WebGL 2 shaders are incompatible
      const forceWebGL1 = window._forceWebGL1 || true;
      window._forceWebGL1 = true;

      function showError(title, message, details = '') {
        loadingScreen.style.display = 'none';
        gameContainer.style.display = 'none';
        errorScreen.classList.add('visible');
        errorTitle.textContent = title;
        errorMessage.textContent = message;
        errorDetails.textContent = details;
      }

      function retryLoad() {
        errorScreen.classList.remove('visible');
        loadingScreen.style.display = 'flex';
        gameContainer.style.display = 'none';
        progressBar.style.width = '0%';
        progressText.textContent = 'Initializing...';
        infoText.textContent = 'Retrying...';
        loadingStartTime = Date.now();
        startUnity();
      }

      function getWebGLContextAttributes() {
        const baseAttrs = {
          preserveDrawingBuffer: true,
          powerPreference: isIOS ? "low-power" : "high-performance",
          failIfMajorPerformanceCaveat: false,
          alpha: false,
          antialias: !isIOS,
          depth: true,
          stencil: true,
          premultipliedAlpha: false,
        };

        if (isIOS) {
          baseAttrs.antialias = false;
          baseAttrs.premultipliedAlpha = true;
          baseAttrs.depth = false;
          baseAttrs.stencil = false;
        }

        return baseAttrs;
      }

      function startUnity() {
        const shouldForceWebGL1 = forceWebGL1 || window._shaderErrorRetried || window._memoryErrorRetried;
        
        const config = {
          dataUrl: "Build/build.data",
          frameworkUrl: "Build/build.framework.js",
          codeUrl: "Build/build.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "LanPiaoPiao",
          productName: "PlantsVsZombiesRH",
          productVersion: "1.0",
          webglContextAttributes: shouldForceWebGL1 ? {
            preserveDrawingBuffer: true,
            powerPreference: "low-power",
            failIfMajorPerformanceCaveat: false,
            alpha: false,
            antialias: false,
            depth: false,
            stencil: false,
            premultipliedAlpha: true,
            majorVersion: 1,
            minorVersion: 0,
          } : getWebGLContextAttributes(),
        };

        if (isIOS || shouldForceWebGL1) {
          config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          config.matchWebGLToCanvasSize = false;
        }

        if (shouldForceWebGL1) {
          console.log('Using forced WebGL 1 compatibility mode');
          infoText.textContent = 'Compatibility mode: WebGL 1 forced';
        }

        createUnityInstance(canvas, config, (progress) => {
          const percent = Math.round(progress * 100);
          progressBar.style.width = percent + '%';
          progressText.textContent = `Loading... ${percent}%`;
          const elapsed = ((Date.now() - loadingStartTime) / 1000).toFixed(1);
          infoText.textContent = `Loaded ${(progress * 180).toFixed(1)}MB of ~180MB • ${elapsed}s elapsed`;
        }).then((instance) => {
          unityInstance = instance;
          loadingScreen.style.display = 'none';
          gameContainer.style.display = 'block';
          canvas.focus();
          canvas.style.background = '#000';

          if (isMobile) {
            gameContainer.classList.add('fullscreen');
            document.body.style.overflow = 'hidden';
            document.body.style.touchAction = 'none';
          }

          setTimeout(() => {
            canvas.style.width = '100%';
            canvas.style.height = '100%';
          }, 100);
        }).catch((err) => {
          console.error('Unity load error:', err);
          let title = 'Failed to Load';
          let message = 'The game failed to load. See details below.';
          let details = err.toString();

          if (err && err.message) {
            if (err.message.includes('wasm')) {
              title = 'WebAssembly Error';
              message = 'WebAssembly compilation failed. Try refreshing or use a different browser.';
            } else if (err.message.includes('memory') || err.message.includes('Memory')) {
              title = 'Out of Memory';
              message = 'Not enough memory. iOS Safari has strict limits. Try: close other tabs, restart Safari, or free up device storage.';
              if (isIOS) {
                details += '\n\niOS Safari memory limit: ~1-2GB. This game needs ~500MB+. Close all other tabs and apps.';
              }
            } else if (err.message.includes('WebGL') || err.message.includes('webgl')) {
              title = 'WebGL Error';
              message = 'WebGL context creation failed. On iOS: ensure iOS 15+, try Private Browsing, or reset Safari settings.';
            } else if (err.message.includes('fetch') || err.message.includes('network') || err.message.includes('404')) {
              title = 'Network Error';
              message = 'Failed to download game files. Check connection and try again.';
            } else if (err.message.includes('shader') || err.message.includes('Shader') || err.message.includes('GL.shaders') || err.message.includes('shaderType')) {
              title = 'Shader Compilation Error';
              message = 'Failed to compile shaders. This is a GPU/driver compatibility issue.';
              details += '\n\nForcing WebGL 1 compatibility mode for retry...';
              
              // Auto-retry with even more restrictive settings for shader errors
              if (!window._shaderErrorRetried) {
                window._shaderErrorRetried = true;
                window._forceWebGL1 = true; // Persist globally
                console.log('Shader error detected, retrying with forced WebGL 1...');
                setTimeout(() => retryWithMinimalConfig(), 500);
                return;
              }
            } else if (err.message.includes('Out of bounds memory access') || err.message.includes('out of bounds')) {
              title = 'Memory Access Error';
              message = 'Runtime memory access violation. This is a build compatibility issue.';
              details += '\n\nThe WASM module tried to access invalid memory. Try: refresh page, clear browser cache, or use a different browser.';
              
              // Auto-retry with minimal config for memory errors
              if (!window._memoryErrorRetried) {
                window._memoryErrorRetried = true;
                console.log('Memory access error detected, retrying with minimal config...');
                setTimeout(() => retryWithMinimalConfig(), 500);
                return;
              }
            } else if (err.message.includes('GL.contexts') || err.message.includes('contextHandle') || err.message.includes('GLctx') || err.message.includes('deleteContext') || err.message.includes('destroy_context')) {
              title = 'WebGL Context Error';
              message = 'WebGL context management error. This can happen when forcing WebGL version.';
              details += '\n\nRetrying without WebGL version forcing...';
              
              // Clear the force flag and retry normally
              window._forceWebGL1 = false;
              window._shaderErrorRetried = false;
              window._memoryErrorRetried = false;
              console.log('Context error detected, clearing force flags and retrying...');
              setTimeout(() => retryLoad(), 500);
              return;
            } else if (err.message.includes('dst.entries') || err.message.includes('reconcile') || err.message.includes('IndexedDB') || err.message.includes('idbfs')) {
              title = 'Data Persistence Error';
              message = 'Failed to initialize game data storage (IndexedDB).';
              details += '\n\nThis can happen in Private Browsing or if storage is full/blocked. Retrying with storage disabled...';
              
              // Retry with IndexedDB disabled
              if (!window._idbErrorRetried) {
                window._idbErrorRetried = true;
                console.log('IndexedDB error detected, retrying with storage disabled...');
                setTimeout(() => retryWithMinimalConfig(), 500);
                return;
              }
            }
          }

          showError(title, message, details);
        });
      }

      if (isMobile) {
        const meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes';
        document.head.appendChild(meta);

        document.documentElement.style.height = '-webkit-fill-available';
        document.body.style.height = '-webkit-fill-available';
        document.body.style.width = '-webkit-fill-available';

        gameContainer.classList.add('fullscreen');
        document.body.style.textAlign = 'left';
        document.body.style.touchAction = 'none';
        document.body.style.overflow = 'hidden';
      }

      // Do NOT add custom touch listeners - they interfere with Unity's touch handling
      // Unity's build.framework.js registers its own touch handlers via JSEvents

      window.addEventListener('error', (e) => {
        if (unityInstance) {
          // Handle runtime errors after Unity loads
          if (e.message.includes('Out of bounds memory access') || e.message.includes('out of bounds')) {
            console.error('Runtime memory access error:', e);
            window._forceWebGL1 = true; // Force WebGL 1 on next retry
            window._memoryErrorRetried = true;
            showError('Runtime Memory Error', 'Memory access violation during gameplay. Retrying with WebGL 1...', 'This is a build compatibility issue. Forcing WebGL 1 compatibility mode.\n\n' + e.message);
            setTimeout(() => retryWithMinimalConfig(), 500);
            return;
          }
          if (e.message.includes('GL.contexts') || e.message.includes('contextHandle') || e.message.includes('GLctx') || e.message.includes('deleteContext') || e.message.includes('destroy_context')) {
            console.error('WebGL context destruction error:', e);
            window._forceWebGL1 = false;
            window._shaderErrorRetried = false;
            window._memoryErrorRetried = false;
            showError('WebGL Context Error', 'WebGL context management error. Retrying without WebGL version forcing...', 'Context handle mismatch detected. Clearing compatibility flags.\n\n' + e.message);
            setTimeout(() => retryLoad(), 500);
            return;
          }
          if (e.message.includes('dst.entries') || e.message.includes('reconcile') || e.message.includes('IndexedDB') || e.message.includes('idbfs')) {
            console.error('IndexedDB/persistence error:', e);
            window._idbErrorRetried = true;
            showError('Data Persistence Error', 'Game data storage error. Retrying with storage disabled...', 'IndexedDB unavailable (Private Browsing or storage blocked).\n\n' + e.message);
            setTimeout(() => retryWithMinimalConfig(), 500);
            return;
          }
        }
        if (unityInstance) return;
        showError('JavaScript Error', 'An unexpected error occurred.', e.message + '\n' + (e.error?.stack || ''));
      });

      window.addEventListener('unhandledrejection', (e) => {
        if (unityInstance) {
          const reason = e.reason?.toString() || '';
          if (reason.includes('Out of bounds memory access') || reason.includes('out of bounds')) {
            console.error('Runtime memory access rejection:', e.reason);
            window._forceWebGL1 = true; // Force WebGL 1 on next retry
            window._memoryErrorRetried = true;
            showError('Runtime Memory Error', 'Memory access violation during gameplay. Retrying with WebGL 1...', reason + '\n\nForcing WebGL 1 compatibility mode.');
            setTimeout(() => retryWithMinimalConfig(), 500);
            return;
          }
          if (reason.includes('GL.contexts') || reason.includes('contextHandle') || reason.includes('GLctx') || reason.includes('deleteContext') || reason.includes('destroy_context')) {
            console.error('WebGL context destruction rejection:', e.reason);
            window._forceWebGL1 = false;
            window._shaderErrorRetried = false;
            window._memoryErrorRetried = false;
            showError('WebGL Context Error', 'WebGL context management error. Retrying without WebGL version forcing...', reason + '\n\nContext handle mismatch detected. Clearing compatibility flags.');
            setTimeout(() => retryLoad(), 500);
            return;
          }
          if (reason.includes('dst.entries') || reason.includes('reconcile') || reason.includes('IndexedDB') || reason.includes('idbfs')) {
            console.error('IndexedDB/persistence rejection:', e.reason);
            window._idbErrorRetried = true;
            showError('Data Persistence Error', 'Game data storage error. Retrying with storage disabled...', 'IndexedDB unavailable (Private Browsing or storage blocked).\n\n' + reason);
            setTimeout(() => retryWithMinimalConfig(), 500);
            return;
          }
        }
        if (unityInstance) return;
        showError('Promise Rejection', 'An async operation failed.', e.reason?.toString() || '');
      });

      canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        console.error('WebGL context lost:', e);
        if (unityInstance) {
          showError('WebGL Context Lost', 'Graphics context lost. iOS may reclaim memory under pressure.', 'Close other tabs/apps and refresh. Avoid switching apps during play.');
        }
      }, false);

      canvas.addEventListener('webglcontextrestored', (e) => {
        console.log('WebGL context restored');
        if (unityInstance) {
          setTimeout(() => retryLoad(), 100);
        }
      }, false);

      function checkWebGLSupport() {
        try {
          const testCanvas = document.createElement('canvas');
          const gl2 = testCanvas.getContext('webgl2', { failIfMajorPerformanceCaveat: false });
          const gl1 = testCanvas.getContext('webgl', { failIfMajorPerformanceCaveat: false }) ||
                     testCanvas.getContext('experimental-webgl', { failIfMajorPerformanceCaveat: false });
          const gl = isIOS ? (gl1 || gl2) : (gl2 || gl1);

          if (!gl) {
            showError('WebGL Not Supported', 'Your browser does not support WebGL.', 'iOS 15+ required. Update iOS or try a different browser.');
            return false;
          }

          const version = gl.getParameter(gl.VERSION);
          const renderer = gl.getParameter(gl.RENDERER);
          const vendor = gl.getParameter(gl.VENDOR);
          const maxTexSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
          const maxVertexAttribs = gl.getParameter(gl.MAX_VERTEX_ATTRIBS);
          const maxVaryingVectors = gl.getParameter(gl.MAX_VARYING_VECTORS);

          console.log('WebGL version:', version);
          console.log('WebGL renderer:', renderer);
          console.log('WebGL vendor:', vendor);
          console.log('Max texture size:', maxTexSize);
          console.log('Max vertex attribs:', maxVertexAttribs);
          console.log('Max varying vectors:', maxVaryingVectors);
          console.log('Is iOS:', isIOS, 'Is Safari:', isSafari);

          // Check for problematic renderers (with null checks)
          if (renderer && typeof renderer === 'string') {
            const rendererLower = renderer.toLowerCase();
            const problematicRenderers = ['swiftshader', 'llvmpipe', 'software', 'mesa'];
            const isSoftwareRenderer = problematicRenderers.some(r => rendererLower.includes(r));
            
            if (isSoftwareRenderer) {
              console.warn('Software renderer detected:', renderer);
              infoText.textContent = 'Warning: Software renderer detected - performance may be poor';
            }
          }

          if (isIOS) {
            if (maxTexSize < 4096) {
              console.warn('Low max texture size:', maxTexSize, '- may cause issues');
            }
            if (!version.includes('WebGL 2') && !version.includes('OpenGL ES 3')) {
              console.log('WebGL 2 not available, will force WebGL 1');
            }
          }

          return true;
        } catch (e) {
          showError('WebGL Error', 'Failed to create WebGL context.', e.toString());
          return false;
        }
      }

      if (isIOS) {
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
      }

      function retryWithMinimalConfig() {
        console.log('Retrying with minimal WebGL 1 config...');
        loadingScreen.style.display = 'flex';
        errorScreen.classList.remove('visible');
        progressBar.style.width = '0%';
        progressText.textContent = 'Retrying with compatibility mode...';
        infoText.textContent = 'Using minimal WebGL 1 settings';
        loadingStartTime = Date.now();

        const minimalConfig = {
          dataUrl: "Build/build.data",
          frameworkUrl: "Build/build.framework.js",
          codeUrl: "Build/build.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "LanPiaoPiao",
          productName: "PlantsVsZombiesRH",
          productVersion: "1.0",
          devicePixelRatio: 1,
          matchWebGLToCanvasSize: false,
          webglContextAttributes: {
            preserveDrawingBuffer: true,
            powerPreference: "low-power",
            failIfMajorPerformanceCaveat: false,
            alpha: false,
            antialias: false,
            depth: false,
            stencil: false,
            premultipliedAlpha: true,
            majorVersion: 1,
            minorVersion: 0,
          },
        };

        createUnityInstance(canvas, minimalConfig, (progress) => {
          const percent = Math.round(progress * 100);
          progressBar.style.width = percent + '%';
          progressText.textContent = `Compatibility mode: ${percent}%`;
          const elapsed = ((Date.now() - loadingStartTime) / 1000).toFixed(1);
          infoText.textContent = `Loaded ${(progress * 180).toFixed(1)}MB of ~180MB • ${elapsed}s elapsed`;
        }).then((instance) => {
          unityInstance = instance;
          loadingScreen.style.display = 'none';
          gameContainer.style.display = 'block';
          canvas.focus();
          canvas.style.background = '#000';
          if (isMobile) {
            gameContainer.classList.add('fullscreen');
            document.body.style.overflow = 'hidden';
            document.body.style.touchAction = 'none';
          }
        }).catch((err) => {
          console.error('Minimal config also failed:', err);
          showError('Compatibility Mode Failed', 'Even minimal WebGL 1 settings failed. This build may require WebGL 2 features not supported on this device.', err.toString() + '\n\nTry: Update iOS to 15.4+, use Private Browsing, or play on desktop browser.');
        });
      }

      if (checkWebGLSupport()) {
        startUnity();
      }
    </script>
  </body>
</html>
