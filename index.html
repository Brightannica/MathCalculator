<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Unity WebGL Player | PlantsVsZombiesRH</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { touch-action: none; overscroll-behavior: none; }
      body {
        background: #1a1a1a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        overflow: hidden;
        position: fixed;
        width: 100%;
        height: 100%;
      }
      #loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 960px;
        padding: 20px;
        z-index: 10;
      }
      #game-container {
        display: none;
        width: 960px;
        height: 600px;
        position: relative;
      }
      #game-container.fullscreen {
        width: 100vw;
        width: -webkit-fill-available;
        height: 100vh;
        height: -webkit-fill-available;
        max-width: none;
        max-height: none;
        position: fixed;
        top: 0;
        left: 0;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
        touch-action: none;
      }
      .logo {
        font-size: 32px;
        font-weight: bold;
        color: #4CAF50;
        letter-spacing: 2px;
      }
      .progress-bar-container {
        width: 100%;
        max-width: 600px;
        height: 8px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4CAF50, #8BC34A);
        border-radius: 4px;
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 14px;
        color: #aaa;
      }
      .error-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 40px;
        text-align: center;
        max-width: 600px;
        z-index: 20;
      }
      .error-screen.visible { display: flex; }
      .error-icon { font-size: 48px; }
      .error-title { font-size: 24px; color: #f44336; }
      .error-message { color: #ccc; font-size: 14px; line-height: 1.6; }
      .error-details { background: #222; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #888; max-height: 200px; overflow: auto; text-align: left; width: 100%; }
      .retry-btn {
        padding: 12px 32px;
        background: #4CAF50;
        border: none;
        border-radius: 4px;
        color: white;
        font-size: 16px;
        cursor: pointer;
        -webkit-appearance: none;
        transition: background 0.2s;
      }
      .retry-btn:hover { background: #45a049; }
      .info-text { color: #666; font-size: 12px; margin-top: 10px; }
      #debug-panel {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 40vh;
        background: rgba(0,0,0,0.95);
        color: #0f0;
        font-family: monospace;
        font-size: 11px;
        padding: 10px;
        overflow-y: auto;
        z-index: 1000;
        border-top: 2px solid #4CAF50;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #debug-panel.visible { display: block; }
      #debug-toggle {
        position: fixed;
        bottom: 10px;
        right: 10px;
        z-index: 1001;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        -webkit-appearance: none;
      }
      #debug-toggle:hover { background: #444; }
      .debug-line { margin-bottom: 2px; border-bottom: 1px solid #222; padding-bottom: 2px; }
      .debug-error { color: #f44; }
      .debug-warn { color: #fa0; }
      .debug-info { color: #0af; }
      @media (max-width: 960px) {
        #game-container { width: 100vw; width: -webkit-fill-available; height: 100vh; height: -webkit-fill-available; }
        #loading-screen { max-width: 100vw; padding: 10px; }
        .logo { font-size: 24px; }
      }
      @supports (-webkit-touch-callout: none) {
        body { min-height: -webkit-fill-available; }
        #game-container.fullscreen { height: -webkit-fill-available; width: -webkit-fill-available; }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="logo">Plants vs Zombies RH</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="progress-text" id="progress-text">Initializing...</div>
      <div class="info-text" id="info-text">Loading game assets (~180MB)...</div>
    </div>

    <div id="error-screen" class="error-screen">
      <div class="error-icon">⚠</div>
      <div class="error-title" id="error-title">Failed to Load</div>
      <div class="error-message" id="error-message"></div>
      <div class="error-details" id="error-details"></div>
      <button class="retry-btn" onclick="retryLoad()">Retry</button>
    </div>

    <div id="game-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>

    <button id="debug-toggle" onclick="toggleDebug()">Show Logs</button>
    <div id="debug-panel"></div>

    <!-- Script 1: CRITICAL patches applied BEFORE loader loads -->
    <script>
      // CRITICAL: Patch WebGL createShader to never return null
      // AND patch shaderSource/compileShader to handle null shaders
      (function() {
        var patchContext = function(proto) {
          if (!proto || !proto.createShader) return;
          var origCreateShader = proto.createShader;
          proto.createShader = function(type) {
            var shader = origCreateShader.call(this, type);
            if (!shader) {
              try {
                return origCreateShader.call(this, this.VERTEX_SHADER);
              } catch (e) {
                return null;
              }
            }
            return shader;
          };

          // Patch shaderSource to handle null/invalid shaders
          var origShaderSource = proto.shaderSource;
          proto.shaderSource = function(shader, source) {
            if (!shader || !(shader instanceof WebGLShader)) {
              console.warn('shaderSource called with invalid shader, skipping');
              return;
            }
            return origShaderSource.call(this, shader, source);
          };

          // Patch compileShader to handle null/invalid shaders
          var origCompileShader = proto.compileShader;
          proto.compileShader = function(shader) {
            if (!shader || !(shader instanceof WebGLShader)) {
              console.warn('compileShader called with invalid shader, skipping');
              return;
            }
            return origCompileShader.call(this, shader);
          };

          // Patch getShaderParameter to handle null/invalid shaders
          var origGetShaderParameter = proto.getShaderParameter;
          proto.getShaderParameter = function(shader, pname) {
            if (!shader || !(shader instanceof WebGLShader)) {
              return null;
            }
            return origGetShaderParameter.call(this, shader, pname);
          };

          // Patch getShaderInfoLog to handle null/invalid shaders
          var origGetShaderInfoLog = proto.getShaderInfoLog;
          proto.getShaderInfoLog = function(shader) {
            if (!shader || !(shader instanceof WebGLShader)) {
              return '';
            }
            return origGetShaderInfoLog.call(this, shader);
          };

          // Patch deleteShader to handle null/invalid shaders
          var origDeleteShader = proto.deleteShader;
          proto.deleteShader = function(shader) {
            if (!shader || !(shader instanceof WebGLShader)) {
              return;
            }
            return origDeleteShader.call(this, shader);
          };
        };
        patchContext(WebGLRenderingContext.prototype);
        if (typeof WebGL2RenderingContext !== 'undefined') {
          patchContext(WebGL2RenderingContext.prototype);
        }
      })();

      // Keep IndexedDB enabled for Unity's IDBFS filesystem
      // (disabling it caused "No GlobalGameManagers file was found" error)

      // iOS Safari optimizations
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      const isMobile = isIOS || /Android/i.test(navigator.userAgent);
    </script>

    <!-- Script 2: Loader script -->
    <script src="Build/build.loader.js?v=4"></script>

    <!-- Script 3: Initialization -->
    <script>
      const loadingScreen = document.getElementById('loading-screen');
      const gameContainer = document.getElementById('game-container');
      const errorScreen = document.getElementById('error-screen');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const infoText = document.getElementById('info-text');
      const errorTitle = document.getElementById('error-title');
      const errorMessage = document.getElementById('error-message');
      const errorDetails = document.getElementById('error-details');
      const canvas = document.getElementById('unity-canvas');

      let unityInstance = null;
      let loadingStartTime = Date.now();

      function showError(title, message, details = '') {
        loadingScreen.style.display = 'none';
        gameContainer.style.display = 'none';
        errorScreen.classList.add('visible');
        errorTitle.textContent = title;
        errorMessage.textContent = message;
        errorDetails.textContent = details;
      }

      async function retryLoad() {
        errorScreen.classList.remove('visible');
        loadingScreen.style.display = 'flex';
        gameContainer.style.display = 'none';
        progressBar.style.width = '0%';
        progressText.textContent = 'Initializing...';
        infoText.textContent = 'Retrying...';
        loadingStartTime = Date.now();
        await startUnity();
      }

      async function loadDataChunks() {
        const chunks = ['Build/build.data.part.aa', 'Build/build.data.part.ab', 'Build/build.data.part.ac', 'Build/build.data.part.ad'];
        const buffers = [];
        let totalSize = 0;
        
        for (const chunk of chunks) {
          const response = await fetch(chunk + '?v=2');
          if (!response.ok) throw new Error('Failed to fetch ' + chunk);
          const buffer = await response.arrayBuffer();
          buffers.push(buffer);
          totalSize += buffer.byteLength;
          console.log('Loaded chunk:', chunk, buffer.byteLength, 'bytes');
        }
        
        // Concatenate all chunks
        const combined = new Uint8Array(totalSize);
        let offset = 0;
        for (const buffer of buffers) {
          combined.set(new Uint8Array(buffer), offset);
          offset += buffer.byteLength;
        }
        
        // Create Blob URL
        const blob = new Blob([combined], { type: 'application/octet-stream' });
        const blobUrl = URL.createObjectURL(blob);
        console.log('Created blob URL:', blobUrl, 'total size:', totalSize);
        return blobUrl;
      }

      async function startUnity() {
        // Load data chunks from local files (same origin, no CORS)
        let dataUrl = "Build/build.data";
        try {
          infoText.textContent = 'Loading game data (188MB)...';
          dataUrl = await loadDataChunks();
          infoText.textContent = 'Game data loaded, starting Unity...';
        } catch (e) {
          console.error('Failed to load data chunks:', e);
          showError('Data Load Error', 'Failed to download game data.', e.toString());
          return;
        }

        const config = {
          dataUrl: dataUrl,
          frameworkUrl: "Build/build.framework.js?v=4",
          codeUrl: "Build/build.wasm?v=4",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "LanPiaoPiao",
          productName: "PlantsVsZombiesRH",
          productVersion: "1.0",
          // webglContextAttributes removed - let Unity use defaults
        };

        if (isIOS) {
          config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
          config.matchWebGLToCanvasSize = false;
        }

        // Check WebGL context max texture size before starting
        const testCanvas = document.createElement('canvas');
        const testGl = testCanvas.getContext('webgl2', config.webglContextAttributes) || testCanvas.getContext('webgl', config.webglContextAttributes);
        if (testGl) {
          const maxTex = testGl.getParameter(testGl.MAX_TEXTURE_SIZE);
          console.log('Pre-flight max texture size:', maxTex);
          if (maxTex === 0) {
            // Retry with software rendering disabled
            config.webglContextAttributes.failIfMajorPerformanceCaveat = false;
            config.webglContextAttributes.powerPreference = "default";
            console.log('Max texture size is 0, retrying with default power preference');
          }
        }

        createUnityInstance(canvas, config, (progress) => {
          const percent = Math.round(progress * 100);
          progressBar.style.width = percent + '%';
          progressText.textContent = `Loading... ${percent}%`;
          const elapsed = ((Date.now() - loadingStartTime) / 1000).toFixed(1);
          infoText.textContent = `Loaded ${(progress * 180).toFixed(1)}MB of ~180MB • ${elapsed}s elapsed`;
        }).then((instance) => {
          unityInstance = instance;
          gameLoaded = true; // Enable touch events
          loadingScreen.style.display = 'none';
          gameContainer.style.display = 'block';
          canvas.focus();
          canvas.style.background = '#000';

          if (isMobile) {
            gameContainer.classList.add('fullscreen');
            document.body.style.overflow = 'hidden';
            document.body.style.touchAction = 'none';
          }

          setTimeout(() => {
            canvas.style.width = '100%';
            canvas.style.height = '100%';
          }, 100);
        }).catch((err) => {
          console.error('Unity load error:', err);
          let title = 'Failed to Load';
          let message = 'The game failed to load. See details below.';
          let details = err.toString();

          if (err && err.message) {
            if (err.message.includes('wasm')) {
              title = 'WebAssembly Error';
              message = 'WebAssembly compilation failed. Try refreshing or use a different browser.';
            } else if (err.message.includes('memory') || err.message.includes('Memory')) {
              title = 'Out of Memory';
              message = 'Not enough memory. iOS Safari has strict limits. Try: close other tabs, restart Safari, or free up device storage.';
              if (isIOS) {
                details += '\n\niOS Safari memory limit: ~1-2GB. This game needs ~500MB+. Close all other tabs and apps.';
              }
            } else if (err.message.includes('WebGL') || err.message.includes('webgl')) {
              title = 'WebGL Error';
              message = 'WebGL context creation failed. On Safari: try Chrome/Firefox, disable "Prevent cross-site tracking", or update macOS.';
            } else if (err.message.includes('fetch') || err.message.includes('network') || err.message.includes('404')) {
              title = 'Network Error';
              message = 'Failed to download game files. Check connection and try again.';
            } else if (err.message.includes('shader') || err.message.includes('Shader') || err.message.includes('GL.shaders') || err.message.includes('shaderType')) {
              title = 'Shader Compilation Error';
              message = 'Failed to compile shaders. This is a GPU/driver compatibility issue.';
              details += '\n\nOn iOS: Update iOS, try Private Browsing mode, or use Chrome/Firefox on iOS (they use WebKit).';
            }
          }

          showError(title, message, details);
        });
      }

      if (isMobile) {
        const meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes';
        document.head.appendChild(meta);

        document.documentElement.style.height = '-webkit-fill-available';
        document.body.style.height = '-webkit-fill-available';
        document.body.style.width = '-webkit-fill-available';

        gameContainer.classList.add('fullscreen');
        document.body.style.textAlign = 'left';
        document.body.style.touchAction = 'none';
        document.body.style.overflow = 'hidden';
      }

      // Prevent touch events from reaching Unity until fully loaded
      // This prevents the "Out of bounds memory access" in touchEventHandlerFunc
      let gameLoaded = false;
      const originalTouchHandler = function(e) {
        if (!gameLoaded && e && typeof e.preventDefault === 'function') {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      };
      canvas.addEventListener('touchstart', originalTouchHandler, { capture: true, passive: false });
      canvas.addEventListener('touchmove', originalTouchHandler, { capture: true, passive: false });
      canvas.addEventListener('touchend', originalTouchHandler, { capture: true, passive: false });

      window.addEventListener('error', (e) => {
        if (unityInstance) return;
        showError('JavaScript Error', 'An unexpected error occurred.', e.message + '\n' + (e.error?.stack || ''));
      });

      window.addEventListener('unhandledrejection', (e) => {
        if (unityInstance) return;
        showError('Promise Rejection', 'An async operation failed.', e.reason?.toString() || '');
      });

      canvas.addEventListener('webglcontextlost', (e) => {
        e.preventDefault();
        console.error('WebGL context lost:', e);
        if (unityInstance) {
          showError('WebGL Context Lost', 'Graphics context lost. iOS may reclaim memory under pressure.', 'Close other tabs/apps and refresh. Avoid switching apps during play.');
        }
      }, false);

      canvas.addEventListener('webglcontextrestored', (e) => {
        console.log('WebGL context restored');
        if (unityInstance) {
          setTimeout(() => retryLoad(), 100);
        }
      }, false);

      function checkWebGLSupport() {
        try {
          const testCanvas = document.createElement('canvas');
          const gl2 = testCanvas.getContext('webgl2', { failIfMajorPerformanceCaveat: false });
          const gl1 = testCanvas.getContext('webgl', { failIfMajorPerformanceCaveat: false }) ||
                     testCanvas.getContext('experimental-webgl', { failIfMajorPerformanceCaveat: false });
          const gl = isIOS ? (gl1 || gl2) : (gl2 || gl1);

          if (!gl) {
            showError('WebGL Not Supported', 'Your browser does not support WebGL.', 'iOS 15+ required. Update iOS or try a different browser.');
            return false;
          }

          const maxTexSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
          console.log('Max texture size:', maxTexSize);
          if (maxTexSize === 0) {
            showError('WebGL Context Error', 'WebGL context has invalid max texture size (0).', 'This can happen with software rendering or restricted GPU access. Try: enable hardware acceleration, disable privacy extensions, or use a different browser.');
            return false;
          }

          return true;
        } catch (e) {
          showError('WebGL Error', 'Failed to create WebGL context.', e.toString());
          return false;
        }
      }

      if (isIOS) {
        document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
      }

      if (checkWebGLSupport()) {
        startUnity();
      }

      // Debug panel - capture console output for diagnosis without devtools
      const debugPanel = document.getElementById('debug-panel');
      const debugToggle = document.getElementById('debug-toggle');
      const debugLogs = [];
      const MAX_DEBUG_LINES = 200;

      function toggleDebug() {
        debugPanel.classList.toggle('visible');
        debugToggle.textContent = debugPanel.classList.contains('visible') ? 'Hide Logs' : 'Show Logs';
        if (debugPanel.classList.contains('visible')) {
          renderDebugLogs();
        }
      }

      function addDebugLog(type, args) {
        const msg = Array.from(args).map(a => {
          try { return typeof a === 'object' ? JSON.stringify(a) : String(a); }
          catch (e) { return String(a); }
        }).join(' ');
        
        debugLogs.push({ type, msg, time: new Date().toLocaleTimeString() });
        if (debugLogs.length > MAX_DEBUG_LINES) debugLogs.shift();
        
        if (debugPanel.classList.contains('visible')) {
          renderDebugLogs();
        }
      }

      function renderDebugLogs() {
        debugPanel.innerHTML = debugLogs.map(log => {
          const cls = log.type === 'error' ? 'debug-error' : log.type === 'warn' ? 'debug-warn' : 'debug-info';
          return `<div class="debug-line ${cls}">[${log.time}] ${escapeHtml(log.msg)}</div>`;
        }).join('');
        debugPanel.scrollTop = debugPanel.scrollHeight;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Override console methods to capture output
      const origLog = console.log;
      const origError = console.error;
      const origWarn = console.warn;
      
      console.log = function(...args) {
        addDebugLog('log', args);
        return origLog.apply(this, args);
      };
      console.error = function(...args) {
        addDebugLog('error', args);
        return origError.apply(this, args);
      };
      console.warn = function(...args) {
        addDebugLog('warn', args);
        return origWarn.apply(this, args);
      };

      // Capture unhandled errors
      window.addEventListener('error', (e) => {
        addDebugLog('error', [`UNCAUGHT: ${e.message}`, e.error?.stack || '']);
      });
      window.addEventListener('unhandledrejection', (e) => {
        addDebugLog('error', [`UNHANDLED REJECTION: ${e.reason}`]);
      });

      // Define debug panel variables
      const dbgIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const dbgSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
      const dbgMobile = dbgIOS || /Android/i.test(navigator.userAgent);

      // Initial log
      addDebugLog('log', ['Debug panel initialized. Logs will appear here.']);
      addDebugLog('log', [`User Agent: ${navigator.userAgent}`]);
      addDebugLog('log', [`iOS: ${dbgIOS}, Safari: ${dbgSafari}, Mobile: ${dbgMobile}`]);
    </script>
  </body>
</html>
